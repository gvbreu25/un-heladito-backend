spring.application.name=un-heladito-backend
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/un_heladito}
spring.datasource.username=${DB_USER:heladito}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.deserialization.fail-on-unknown-properties=true
springdoc.swagger-ui.csrf.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

app.jwt.secret=${JWT_SECRET:}
app.frontend.origin=${FRONTEND_ORIGIN:http://localhost:5173}
app.cookie.secure=${COOKIE_SECURE:false}
app.demo.admin-password=${DEMO_ADMIN_PASSWORD:}
app.demo.vendor-password=${DEMO_VENDOR_PASSWORD:}
app.demo.client-password=${DEMO_CLIENT_PASSWORD:}
